# ============================================================================
# PROYECTO COLABORATIVO COIL 2026: RUTA ANDINA
# TECSUP (Perú) & Institución Universitaria Politécnico Grancolombiano (Colombia)
# Configuración de Conexión a Supabase (PostgreSQL 15+) / Spring Boot 3
# ============================================================================

spring.application.name=Ruta Andina - Movilidad Corporativa y Urbana
server.port=8080

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE CONEXIÓN A SUPABASE (POSTGRESQL)
# Para conectar tu instancia de Supabase:
# 1. Ve a tu proyecto en https://supabase.com -> Project Settings -> Database
# 2. Copia la Connection String (JDBC / URI)
# 3. Reemplaza el Host, Usuario y Contraseña a continuación:
# ----------------------------------------------------------------------------
# Si usas Connection Pooling (Puerto 6543 o 5432 Directo):
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.YOUR_PROJECT_ID.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:YOUR_SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuración de Servidor Web y Archivos Estáticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logger
logging.level.org.springframework=INFO
logging.level.com.rutaandina=DEBUG
